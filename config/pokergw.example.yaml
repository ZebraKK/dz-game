# poker gateway runtime configuration
# Explicit command-line flags override the corresponding YAML values.
addr: "127.0.0.1:8080"
serverId: "poker-local-1"
identityFile: "./data/identities.json"
historyFile: "./data/history.jsonl"
# Set both files to enable built-in TLS/WSS. Leave both empty behind a TLS reverse proxy.
tlsCertFile: ""
tlsKeyFile: ""
allowedOrigins: []

table:
  smallBlind: 10
  bigBlind: 20
  startingStack: 2000
  actionTimeoutMs: 180000
  disconnectGraceMs: 300000
  startCountdownMs: 10000
  resultDisplayMs: 30000
  readyTimeoutMs: 300000
