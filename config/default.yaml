# QBDZ 默认场景配置
# 对应 C++ Source/SoGameLogic/SoConfig.h 中的各配置结构体

scene:
  logFlag: 1
  errLogFlag: 1
  sceneLevel: 10301      # ST_CLASSIC 经典场
  gameType: 1            # GT_CLASSIC
  sceneName: "经典场"
  seatCount: 9
  serviceCharge: 5       # 抽水 5%
  waitForStart: 10       # 等待10秒开始
  chipRatio: 1
  actionTimeSec: 30      # 玩家行动超时30秒
  smallBlind: 50
  bigBlind: 100
  minBuyIn: 2000
  maxBuyIn: 20000
  minCoin: 2000
  maxCoin: 0             # 0=无上限
  defaultBuyIn: 5000
  canRebuy: false
  canAddOn: false

system:
  enableRookieTraining: false
  rookieTrainingRoundLimit: 10

# SNG 盲注递增表（每级持续600秒=10分钟）
