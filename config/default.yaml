# SNG 配置
sng:
  sceneLevel: 10303
  initChips: 10000
  ticketPrice: 100
  serviceCharge: 10
  rewards:
    - rank: 1
      propertyID: 1030101
      propertyCount: 500
    - rank: 2
      propertyID: 1030101
      propertyCount: 200
    - rank: 3
      propertyID: 1030101
      propertyCount: 0

# 牛仔场景配置
cowboy:
  sceneLevel: 10390
  seatCount: 8
  roomCapacity: 1000
  minCoin: 0
  maxCoin: 0
  waitTimeSec: 3
  betTimeSec: 15
  resultToStartSec: 10
  seatPlayerRefresh: 3
  tableBetLimit: 10000000
  playerBetLimit: 5000000
  betCoinInfos:
    - minCoin: 0
      betCoin: 10
    - minCoin: 1000
      betCoin: 50
    - minCoin: 5000
      betCoin: 100

# 牛仔赔率配置（position → odds）
cowboyOdds:
  oddInfos:
    - position: 1   # 平局
      cdCount: 0
      odds: 8
    - position: 2   # 人赢
      cdCount: 0
      odds: 2
    - position: 3   # 牛赢
      cdCount: 0
      odds: 2
    - position: 11  # 同花
      cdCount: 0
      odds: 4
    - position: 12  # 连牌
      cdCount: 0
      odds: 4
    - position: 13  # 对子
      cdCount: 0
      odds: 4
    - position: 14  # 同花连牌
      cdCount: 0
      odds: 25
    - position: 15  # AA
      cdCount: 0
      odds: 25
